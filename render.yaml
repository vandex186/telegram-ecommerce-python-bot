# Render Blueprint: Background Worker for 24/7 Telegram bot polling
# Import this file in Render Dashboard → New → Blueprint

services:
  - type: worker
    name: telegram-ecommerce-bot
    runtime: python
    buildCommand: pip install -r requirements.txt && (pip uninstall -y apscheduler || true)
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: STOCK_CHANNEL_ID
        sync: false
      - key: CATALOG_SYNC_POST_LIMIT
        value: "100"
      - key: CATALOG_SYNC_INTERVAL_MINUTES
        value: "5"
      - key: DATABASE_FILE
        value: "/data/orders.db"
      - key: PAYMENT_USDT_QR_DIR
        value: "payment_qr/usdt"
      - key: PAYMENT_QR_DIR
        value: "payment_qr/local"
      - key: PAYMENT_QR_LABEL
        value: "ABA QR"
      - key: OXAPAY_API_KEY
        sync: false
      - key: TZ
        value: UTC
    # Attach a persistent Disk in the Render dashboard (mount path /data)
    # so orders.db survives redeploys.
